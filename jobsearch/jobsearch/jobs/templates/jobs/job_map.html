{% extends "jobs/base.html" %}
{% block title %}Job Map{% endblock %}


{% block content %}
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Job Locations</h2>
    <div class="d-flex align-items-center gap-3">
      <label class="fw-semibold text-secondary mb-0">Distance:</label>
      <div class="d-flex align-items-center gap-2" style="min-width: 240px;">
        <input id="radius-range" type="range" class="form-range" min="0" max="100" step="1" value="10" aria-label="Distance radius in miles">
        <span id="radius-value" class="small text-secondary fw-semibold" style="min-width: 70px; text-align: right;">10 miles</span>
      </div>
      <button id="locate-btn" class="btn btn-primary btn-sm">Use my location</button>
    </div>
  </div>

  <div id="map" style="height: 550px; border-radius: 12px;"></div>
  <div id="status" class="text-secondary small mt-2"></div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const map = L.map('map').setView([33.7756, -84.3963], 11);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // All jobs with coordinates
  const allJobs = [
    {% for job in jobs %}
    {
      lat: {{ job.latitude }},
      lng: {{ job.longitude }},
      title: "{{ job.title|escapejs }}",
      company: "{{ job.company|escapejs }}",
      url: "{% url 'job_detail' job.pk %}",
      skills: "{{ job.skills|escapejs }}"
    },
    {% endfor %}
  ];

  let markers = [];
  let userMarker = null;
  let radiusCircle = null;
  let userLat = null;
  let userLng = null;

  function milesToMeters(miles) {
    return miles * 1609.34;
  }

  function distanceBetween(lat1, lon1, lat2, lon2) {
    // Haversine formula, returns miles
    const R = 3958.8;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function clearMarkers() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];
  }

  function showJobs(jobs) {
    // Clear existing markers
    clearMarkers();

    jobs.forEach(job => {
      const marker = L.marker([job.lat, job.lng]).addTo(map);
      marker.bindPopup(`
        <div style="min-width: 200px;">
          <div style="font-weight: 700;">${job.title}</div>
          <div style="color: #666;">${job.company}</div>
          <div style="margin-top: 6px;">
            <a href="${job.url}" class="btn btn-sm btn-primary">View</a>
          </div>
        </div>
      `);
      markers.push(marker);
    });

    document.getElementById('status').textContent =
      `Showing ${jobs.length} of ${allJobs.length} jobs`;
  }

  function filterByDistance() {
    const radius = parseFloat(document.getElementById('radius-range').value);

    // Remove old circle
    if (radiusCircle) {
      map.removeLayer(radiusCircle);
      radiusCircle = null;
    }

    if (userLat === null || userLng === null) {
  showJobs(allJobs);
  document.getElementById('status').textContent =
    'Click "Use my location" to filter by distance.';
  return;
}

if (radius === 0) {
  showJobs(allJobs);
  document.getElementById('status').textContent =
    `Showing all ${allJobs.length} jobs`;
  return;
}

    // Draw radius circle
    radiusCircle = L.circle([userLat, userLng], {
      radius: milesToMeters(radius),
      color: '#0a66c2',
      fillColor: '#0a66c2',
      fillOpacity: 0.08,
      weight: 2
    }).addTo(map);

    // Filter jobs
    const filtered = allJobs
      .map(job => ({
        ...job,
        distance: distanceBetween(userLat, userLng, job.lat, job.lng)
      }))
      .filter(job => job.distance <= radius)
      .sort((a, b) => a.distance - b.distance);

    showJobs(filtered);

    // Fit map to circle bounds
    map.fitBounds(radiusCircle.getBounds());
  }

  // Locate user
  document.getElementById('locate-btn').addEventListener('click', function() {
  if (!navigator.geolocation) {
    document.getElementById('status').textContent = 'Geolocation not supported by your browser.';
    return;
  }

  document.getElementById('status').textContent = 'Locating...';

  navigator.geolocation.getCurrentPosition(
    function(pos) {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;

      // Remove old marker if it exists
      if (userMarker) {
        map.removeLayer(userMarker);
      }

      // Add new user marker
      userMarker = L.marker([userLat, userLng]).addTo(map)
        .bindPopup("Your Location")
        .openPopup();

      document.getElementById('status').textContent =
        'Location found. Use the distance slider to filter jobs.';

      map.setView([userLat, userLng], 12);

      filterByDistance();
    },
    function(err) {
      document.getElementById('status').textContent =
        'Could not get location: ' + err.message;
    }
  );
});

  // Re-filter when radius changes
  function updateRadiusLabel() {
    const v = parseFloat(document.getElementById('radius-range').value);
    document.getElementById('radius-value').textContent = (v === 0) ? 'All jobs' : `${v} miles`;
  }

  document.getElementById('radius-range').addEventListener('input', function () {
    updateRadiusLabel();
    filterByDistance();
  });

  // Initial load: show all jobs
  showJobs(allJobs);
  updateRadiusLabel();
</script>
{% endblock %}
