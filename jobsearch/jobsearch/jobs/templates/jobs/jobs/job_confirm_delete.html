<!-- jobs/templates/jobs/job_confirm_delete.html -->
{% extends "jobs/base.html" %}
{% block title %}Delete Job{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 500px;">
  <div class="bg-white p-4 rounded-4 border shadow-sm">
    <h3 class="fw-bold mb-3">Delete this posting?</h3>
    <p>Are you sure you want to delete <strong>{{ job.title }}</strong> at {{ job.company }}?</p>

    <form method="post">
      {% csrf_token %}
      <div class="d-flex gap-2">
        <button class="btn btn-danger" type="submit">Yes, delete</button>
        <a href="{% url 'recruiter_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
