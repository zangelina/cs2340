<!-- jobs/templates/jobs/job_confirm_delete.html -->
{% extends "jobs/base.html" %}
{% block title %}Delete Job{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 550px;">
  <div class="bg-white p-4 rounded-4 border shadow-sm text-center">

    <div class="mb-3">
      <div class="display-6 text-danger">⚠</div>
      <h3 class="fw-bold mb-2">Delete Job Posting</h3>
      <p class="text-secondary mb-0">
        This action cannot be undone.
      </p>
    </div>

    <div class="bg-light rounded-3 p-3 mb-4">
      <div class="fw-semibold">{{ job.title }}</div>
      <div class="text-secondary small">
        {{ job.company }} · {{ job.location|default:"No location" }}
      </div>
    </div>

    <form method="post">
      {% csrf_token %}
      <div class="d-flex justify-content-center gap-2">
        <button class="btn btn-danger px-4" type="submit">
          Yes, Delete
        </button>
        <a href="{% url 'recruiter_dashboard' %}" class="btn btn-outline-secondary px-4">
          Cancel
        </a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
